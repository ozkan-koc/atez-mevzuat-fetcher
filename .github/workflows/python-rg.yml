name: ATEZ Resmi Gazete Fetch

on:
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-rg.yml"
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date YYYY-MM-DD (blank = today in Europe/Istanbul)"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  test-and-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install collector
        working-directory: python
        run: python -m pip install -e ".[test]"

      - name: Unit and integration tests
        working-directory: python
        run: pytest

      - name: Resolve Turkey target date
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "TARGET_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "TARGET_DATE=$(TZ=Europe/Istanbul date +%F)" >> "$GITHUB_ENV"
          fi

      - name: Collect evidence
        if: github.event_name != 'pull_request'
        working-directory: python
        run: python rg_fetch.py "$TARGET_DATE"

      - name: Upload evidence and diagnostics
        id: evidence
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v6
        with:
          name: resmi-gazete-${{ github.run_id }}
          path: python/out/
          if-no-files-found: warn
          retention-days: 14

      - name: Expose scheduled run identity to analyzer
        if: github.event_name == 'schedule' && always()
        uses: actions/github-script@v8
        env:
          TARGET_DATE: ${{ env.TARGET_DATE }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactId = process.env.ARTIFACT_ID || 'none';
            const digest = (process.env.ARTIFACT_DIGEST || '').replace(/^sha256:/, '');
            const description = `run=${context.runId} artifact=${artifactId} sha256=${digest.slice(0, 24)}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: `atez-collector/schedule/${process.env.TARGET_DATE}`,
              description: description.slice(0, 140),
              target_url: runUrl,
            });
