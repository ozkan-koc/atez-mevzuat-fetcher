name: Python Resmi Gazete Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date YYYY-MM-DD'
        required: false
        default: '2026-08-18'
        type: string

permissions:
  contents: read

jobs:
  test-and-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install requests beautifulsoup4 pytest
      - name: Unit tests
        working-directory: python
        run: pytest -q
      - name: Fetch Resmi Gazete
        working-directory: python
        env:
          TARGET_DATE: ${{ inputs.date || '2026-08-18' }}
        run: python rg_fetch.py "$TARGET_DATE"
      - name: Upload Python scraper evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-rg-${{ github.run_id }}
          path: python/out/
          if-no-files-found: warn
          retention-days: 14
