name: ATEZ Resmi Gazete Fetch

on:
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-rg.yml"
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Target date YYYY-MM-DD (blank = today in Europe/Istanbul)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-and-fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install collector
        working-directory: python
        run: python -m pip install -e ".[test]"

      - name: Unit and integration tests
        working-directory: python
        run: pytest

      - name: Resolve Turkey target date
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "TARGET_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "TARGET_DATE=$(TZ=Europe/Istanbul date +%F)" >> "$GITHUB_ENV"
          fi

      - name: Collect evidence
        if: github.event_name != 'pull_request'
        working-directory: python
        run: python rg_fetch.py "$TARGET_DATE"

      - name: Upload evidence and diagnostics
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v6
        with:
          name: resmi-gazete-${{ github.run_id }}
          path: python/out/
          if-no-files-found: warn
          retention-days: 14
