[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atez-collector"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
atez-collector = "atez_collector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
